<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APEC 2606 Clock Wall</title>
  <style>
    :root {
      --bg: transparent;
      --card: rgba(255, 255, 255, 0.96);
      --ink: #111111;
      --muted: #6b6b6b;
      --line: rgba(17, 17, 17, 0.10);
      --accent: #d71920;
      --card-day: rgba(255, 255, 255, 0.96);
      --card-night: rgba(20, 23, 32, 0.96);
      --ink-night: #f6f4ee;
      --muted-night: rgba(246,244,238,0.68);
      --line-night: rgba(246,244,238,0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: start center;
    }

    .clock-wall {
      width: 100%;
      max-width: 1180px;
      padding: 10px;
    }

    .clocks {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    .clock-card {
      background: var(--card-day);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: clamp(14px, 1.7vw, 22px) clamp(10px, 1.4vw, 18px);
      display: grid;
      justify-items: center;
      min-width: 0;
      overflow: hidden;
      box-shadow:
        0 1px 1px rgba(17, 17, 17, 0.018),
        0 2px 8px rgba(17, 17, 17, 0.026);
      transition: background 260ms ease, color 260ms ease, border-color 260ms ease;
    }

    .clock-card.day {
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 227, 120, 0.18), transparent 42%),
        var(--card-day);
      color: var(--ink);
      border-color: var(--line);
    }

    .clock-card.night {
      background:
        radial-gradient(circle at 50% 14%, rgba(255, 255, 255, 0.09), transparent 36%),
        linear-gradient(180deg, rgba(32, 39, 58, 0.98), rgba(15, 17, 25, 0.98));
      color: var(--ink-night);
      border-color: var(--line-night);
      box-shadow:
        0 1px 1px rgba(0, 0, 0, 0.08),
        0 2px 8px rgba(0, 0, 0, 0.10);
    }

    .clock-card.unknown-light {
      background: var(--card-day);
    }

    .face {
      width: clamp(150px, 15vw, 215px);
      max-width: 92%;
      aspect-ratio: 1 / 1;
      margin-bottom: clamp(12px, 1.25vw, 18px);
    }

    .city {
      font-size: clamp(10px, 1.05vw, 13px);
      font-weight: 760;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.28;
    }

    .zone {
      color: var(--muted);
      font-size: clamp(9px, 0.9vw, 11px);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-top: 5px;
      text-align: center;
      line-height: 1.25;
    }

    .digital {
      font-variant-numeric: tabular-nums;
      font-size: clamp(25px, 2.35vw, 34px);
      letter-spacing: 0.045em;
      margin-top: clamp(9px, 1vw, 13px);
      font-weight: 560;
      line-height: 1;
    }

    .date {
      color: var(--muted);
      font-size: clamp(10px, 0.95vw, 12px);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .clock-card.night .zone,
    .clock-card.night .date {
      color: var(--muted-night);
    }

    .face circle.outer {
      fill: #fff;
      stroke: #111;
      stroke-width: 3.4;
      transition: fill 260ms ease, stroke 260ms ease;
    }

    .clock-card.night .face circle.outer {
      fill: #151923;
      stroke: rgba(246,244,238,0.92);
    }

    .tick {
      stroke: #111;
      stroke-linecap: round;
      transition: stroke 260ms ease;
    }

    .clock-card.night .tick {
      stroke: rgba(246,244,238,0.88);
    }

    .tick.major { stroke-width: 3.8; }
    .tick.minor { stroke-width: 1.15; opacity: 0.72; }

    .hand-hour,
    .hand-minute {
      stroke: #111;
      stroke-linecap: round;
      transform-origin: 100px 100px;
      transition: stroke 260ms ease;
    }

    .clock-card.night .hand-hour,
    .clock-card.night .hand-minute {
      stroke: rgba(246,244,238,0.96);
    }

    .hand-hour { stroke-width: 7.2; }
    .hand-minute { stroke-width: 4.8; }

    .hand-second {
      stroke: var(--accent);
      stroke-width: 2.35;
      stroke-linecap: round;
      transform-origin: 100px 100px;
    }

    .pin {
      fill: var(--accent);
    }

    .light-status {
      margin-top: 6px;
      font-size: clamp(8px, 0.85vw, 10px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .clock-card.night .light-status {
      color: var(--muted-night);
    }


    @media (min-width: 621px) and (max-width: 760px) {
      .clock-wall {
        padding: 8px;
      }

      .clocks {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .clock-card {
        border-radius: 16px;
        padding: 12px 8px;
      }

      .face {
        width: clamp(112px, 18vw, 150px);
        max-width: 94%;
      }

      .digital {
        font-size: clamp(20px, 3.2vw, 27px);
      }

      .city {
        font-size: clamp(8px, 1.55vw, 11px);
        letter-spacing: 0.07em;
      }

      .zone {
        font-size: clamp(8px, 1.45vw, 10px);
      }

      .date {
        font-size: clamp(8px, 1.35vw, 10px);
      }
    }

    @media (max-width: 620px) {
      .clock-wall {
        padding: 8px;
      }

      .clocks {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .clock-card {
        border-radius: 18px;
        padding: 16px 10px;
      }

      .face {
        width: clamp(128px, 38vw, 188px);
      }

      .digital {
        font-size: clamp(24px, 6vw, 33px);
      }

      .city {
        font-size: clamp(10px, 2.8vw, 13px);
      }

      .zone {
        font-size: clamp(9px, 2.3vw, 11px);
      }
    }

    @media (max-width: 340px) {
      .clocks {
        grid-template-columns: 1fr;
      }

      .face {
        width: min(185px, 72vw);
      }
    }
  </style>
</head>
<body>
  <main class="clock-wall" aria-label="APEC 2606 travel time zone clock wall">
    <section class="clocks">
      <article class="clock-card unknown-light" data-zone="Asia/Shanghai" data-lat="39.9042" data-lon="116.4074">
        <svg class="face" viewBox="0 0 200 200" role="img" aria-label="UTC+8 analog clock">
          <circle class="outer" cx="100" cy="100" r="92"></circle>
          <g class="ticks"></g>
          <line class="hand-hour" x1="100" y1="100" x2="100" y2="56"></line>
          <line class="hand-minute" x1="100" y1="100" x2="100" y2="34"></line>
          <line class="hand-second" x1="100" y1="116" x2="100" y2="28"></line>
          <circle class="pin" cx="100" cy="100" r="5.2"></circle>
        </svg>
        <div class="city">Beijing · Hong Kong<br>Kuala Lumpur</div>
        <div class="zone">UTC+8</div>
        <div class="digital">--:--:--</div>
        <div class="date">---</div>
        <div class="light-status">Loading light</div>
      </article>

      <article class="clock-card unknown-light" data-zone="Asia/Bangkok" data-lat="13.7563" data-lon="100.5018">
        <svg class="face" viewBox="0 0 200 200" role="img" aria-label="UTC+7 analog clock">
          <circle class="outer" cx="100" cy="100" r="92"></circle>
          <g class="ticks"></g>
          <line class="hand-hour" x1="100" y1="100" x2="100" y2="56"></line>
          <line class="hand-minute" x1="100" y1="100" x2="100" y2="34"></line>
          <line class="hand-second" x1="100" y1="116" x2="100" y2="28"></line>
          <circle class="pin" cx="100" cy="100" r="5.2"></circle>
        </svg>
        <div class="city">Jakarta · Bangkok</div>
        <div class="zone">UTC+7</div>
        <div class="digital">--:--:--</div>
        <div class="date">---</div>
        <div class="light-status">Loading light</div>
      </article>

      <article class="clock-card unknown-light" data-zone="Europe/Berlin" data-lat="48.1351" data-lon="11.5820">
        <svg class="face" viewBox="0 0 200 200" role="img" aria-label="Munich analog clock">
          <circle class="outer" cx="100" cy="100" r="92"></circle>
          <g class="ticks"></g>
          <line class="hand-hour" x1="100" y1="100" x2="100" y2="56"></line>
          <line class="hand-minute" x1="100" y1="100" x2="100" y2="34"></line>
          <line class="hand-second" x1="100" y1="116" x2="100" y2="28"></line>
          <circle class="pin" cx="100" cy="100" r="5.2"></circle>
        </svg>
        <div class="city">Munich</div>
        <div class="zone">CEST · UTC+2</div>
        <div class="digital">--:--:--</div>
        <div class="date">---</div>
        <div class="light-status">Loading light</div>
      </article>

      <article class="clock-card unknown-light" data-zone="America/New_York" data-lat="40.7128" data-lon="-74.0060">
        <svg class="face" viewBox="0 0 200 200" role="img" aria-label="New York Eastern Time analog clock">
          <circle class="outer" cx="100" cy="100" r="92"></circle>
          <g class="ticks"></g>
          <line class="hand-hour" x1="100" y1="100" x2="100" y2="56"></line>
          <line class="hand-minute" x1="100" y1="100" x2="100" y2="34"></line>
          <line class="hand-second" x1="100" y1="116" x2="100" y2="28"></line>
          <circle class="pin" cx="100" cy="100" r="5.2"></circle>
        </svg>
        <div class="city">New York</div>
        <div class="zone">EDT · UTC-4</div>
        <div class="digital">--:--:--</div>
        <div class="date">---</div>
        <div class="light-status">Loading light</div>
      </article>
    </section>
  </main>

  <script>

    const lightCache = new Map();

    function parseLocalDateTime(value, zone) {
      if (!value) return null;
      // Open-Meteo returns local timestamps such as "2026-05-30T05:21".
      // Convert that local clock time to a comparable pseudo-Date by reading its parts.
      const [datePart, timePart] = value.split("T");
      if (!datePart || !timePart) return null;
      const [year, month, day] = datePart.split("-").map(Number);
      const [hour, minute] = timePart.split(":").map(Number);
      return { year, month, day, hour, minute };
    }

    function localPartsForZone(zone) {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: zone,
        hour12: false,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).formatToParts(new Date()).reduce((acc, part) => {
        acc[part.type] = part.value;
        return acc;
      }, {});
      return {
        year: Number(parts.year),
        month: Number(parts.month),
        day: Number(parts.day),
        hour: Number(parts.hour),
        minute: Number(parts.minute)
      };
    }

    function minutesSinceMidnight(parts) {
      return parts.hour * 60 + parts.minute;
    }

    function sameLocalDate(a, b) {
      return a && b && a.year === b.year && a.month === b.month && a.day === b.day;
    }

    function hhmm(parts) {
      if (!parts) return "--:--";
      return String(parts.hour).padStart(2, "0") + ":" + String(parts.minute).padStart(2, "0");
    }

    async function fetchLightInfo(card) {
      const lat = card.dataset.lat;
      const lon = card.dataset.lon;
      const zone = card.dataset.zone;
      const key = zone + ":" + lat + "," + lon;

      if (lightCache.has(key)) return lightCache.get(key);

      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + encodeURIComponent(lat) +
        "&longitude=" + encodeURIComponent(lon) +
        "&daily=sunrise,sunset" +
        "&timezone=auto" +
        "&forecast_days=1";

      const promise = fetch(url)
        .then(response => {
          if (!response.ok) throw new Error("Sunrise/sunset request failed");
          return response.json();
        })
        .then(data => {
          const sunrise = parseLocalDateTime(data.daily?.sunrise?.[0], zone);
          const sunset = parseLocalDateTime(data.daily?.sunset?.[0], zone);
          return { sunrise, sunset };
        })
        .catch(() => null);

      lightCache.set(key, promise);
      return promise;
    }

    function applyLightState(card, lightInfo) {
      const zone = card.dataset.zone;
      const nowLocal = localPartsForZone(zone);
      const status = card.querySelector(".light-status");

      let isDay = false;
      let label = "Light unavailable";

      if (lightInfo && sameLocalDate(nowLocal, lightInfo.sunrise) && sameLocalDate(nowLocal, lightInfo.sunset)) {
        const nowMin = minutesSinceMidnight(nowLocal);
        const sunriseMin = minutesSinceMidnight(lightInfo.sunrise);
        const sunsetMin = minutesSinceMidnight(lightInfo.sunset);
        isDay = nowMin >= sunriseMin && nowMin < sunsetMin;
        label = (isDay ? "Day" : "Night") + " · " + hhmm(lightInfo.sunrise) + "–" + hhmm(lightInfo.sunset);
      } else {
        // Safe fallback if API is unavailable: approximate day/night by local clock.
        const hour = nowLocal.hour;
        isDay = hour >= 6 && hour < 18;
        label = (isDay ? "Day" : "Night") + " · approx";
      }

      card.classList.remove("day", "night", "unknown-light");
      card.classList.add(isDay ? "day" : "night");
      if (status) status.textContent = label;
    }

    async function updateLightStates() {
      const cards = Array.from(document.querySelectorAll(".clock-card"));
      await Promise.all(cards.map(async card => {
        const lightInfo = await fetchLightInfo(card);
        applyLightState(card, lightInfo);
      }));
    }

    function buildTicks(svg) {
      const group = svg.querySelector(".ticks");
      for (let i = 0; i < 60; i++) {
        const angle = (i * 6 - 90) * Math.PI / 180;
        const major = i % 5 === 0;
        const r1 = major ? 77 : 84;
        const r2 = 88.5;
        const x1 = 100 + Math.cos(angle) * r1;
        const y1 = 100 + Math.sin(angle) * r1;
        const x2 = 100 + Math.cos(angle) * r2;
        const y2 = 100 + Math.sin(angle) * r2;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1.toFixed(2));
        line.setAttribute("y1", y1.toFixed(2));
        line.setAttribute("x2", x2.toFixed(2));
        line.setAttribute("y2", y2.toFixed(2));
        line.setAttribute("class", "tick " + (major ? "major" : "minor"));
        group.appendChild(line);
      }
    }

    function partsForZone(zone) {
      const now = new Date();
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: zone,
        hour12: false,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).formatToParts(now).reduce((acc, part) => {
        acc[part.type] = part.value;
        return acc;
      }, {});
      return {
        hour: Number(parts.hour),
        minute: Number(parts.minute),
        second: Number(parts.second),
        date: parts.weekday + " · " + parts.year + "-" + parts.month + "-" + parts.day,
        digital: parts.hour + ":" + parts.minute + ":" + parts.second
      };
    }

    function updateClock(card) {
      const zone = card.dataset.zone;
      const t = partsForZone(zone);

      const secondAngle = t.second * 6;
      const minuteAngle = (t.minute + t.second / 60) * 6;
      const hourAngle = ((t.hour % 12) + t.minute / 60 + t.second / 3600) * 30;

      card.querySelector(".hand-hour").style.transform = "rotate(" + hourAngle + "deg)";
      card.querySelector(".hand-minute").style.transform = "rotate(" + minuteAngle + "deg)";
      card.querySelector(".hand-second").style.transform = "rotate(" + secondAngle + "deg)";

      card.querySelector(".digital").textContent = t.digital;
      card.querySelector(".date").textContent = t.date;
    }

    document.querySelectorAll(".face").forEach(buildTicks);

    function tick() {
      document.querySelectorAll(".clock-card").forEach(updateClock);
    }

    tick();
    updateLightStates();
    setInterval(tick, 1000);
    setInterval(updateLightStates, 10 * 60 * 1000);
  </script>
</body>
</html>
